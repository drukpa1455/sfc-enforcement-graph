[project]
name = "qf-sfc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic-ai-slim[openai]>=1,<2", "pydantic>=2.12,<3"]

[project.scripts]
qf-sfc-sync = "qf_sfc.sync:main"
qf-sfc-extract = "qf_sfc.extract:main"
qf-sfc-export = "qf_sfc.export:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
