[project]
name = "sfc-enforcement-graph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic-ai-slim[openai]>=1,<2", "pydantic>=2.12,<3"]

[project.scripts]
sfc-graph-sync = "sfc_enforcement_graph.sync:main"
sfc-graph-extract = "sfc_enforcement_graph.extract:main"
sfc-graph-export = "sfc_enforcement_graph.export:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7,<10",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
